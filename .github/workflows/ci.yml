name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GYM_DATABASE_URL: jdbc:postgresql://localhost:5432/gym_app
      GYM_DATABASE_USERNAME: gym_app
      GYM_DATABASE_PASSWORD: gym_app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gym_app
          POSTGRES_USER: gym_app
          POSTGRES_PASSWORD: gym_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_app -d gym_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew test --no-daemon

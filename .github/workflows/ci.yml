name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only checks out repository contents and runs local tests.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GYM_DATABASE_URL: jdbc:postgresql://localhost:5432/gym_app
      GYM_DATABASE_USERNAME: gym_app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gym_app
          POSTGRES_USER: gym_app
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_app -d gym_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate immutable GitHub Action pins
        shell: pwsh
        working-directory: .
        run: ./scripts/validate_github_actions_pins.ps1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew test --no-daemon
